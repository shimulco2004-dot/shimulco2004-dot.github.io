<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t"><title id="t">NOOR X1 locked background and location reference sheet</title><rect width="1600" height="1000" fill="#ebe7dc"/><text x="80" y="85" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#161918" letter-spacing="4">LOCKED REFERENCE 03 / WORLD</text><text x="80" y="132" font-family="Arial,sans-serif" font-size="18" fill="#666d68">Saudi contemporary luxury · architectural minimalism · dawn-to-golden-hour continuity</text><g font-family="Arial,sans-serif"><g transform="translate(70 205)"><rect width="455" height="510" rx="24" fill="#cdbb9e"/><rect x="36" y="110" width="380" height="230" fill="#c9c0ad"/><rect x="76" y="158" width="110" height="182" fill="#7e7161"/><rect x="214" y="135" width="166" height="205" fill="#dad3c5"/><circle cx="367" cy="84" r="62" fill="#f0b866" opacity=".68"/><path d="M0 390h455v120H0z" fill="#aa8a62"/><text x="22" y="486" fill="#191b19" font-size="16" font-weight="700">VILLA / DAWN</text></g><g transform="translate(573 205)"><rect width="455" height="510" rx="24" fill="#d9b476"/><path d="M0 330C100 272 196 250 294 265c72 10 126 30 161 56v189H0z" fill="#c9965f"/><path d="M70 420C195 351 307 333 455 356" stroke="#5f5b50" stroke-width="26" fill="none"/><circle cx="355" cy="88" r="64" fill="#f4d295"/><text x="22" y="486" fill="#191b19" font-size="16" font-weight="700">DESERT ROAD / SUNRISE</text></g><g transform="translate(1076 205)"><rect width="455" height="510" rx="24" fill="#555f62"/><rect x="30" y="95" width="88" height="280" fill="#949fa2"/><rect x="138" y="55" width="105" height="320" fill="#6f7b80"/><rect x="265" y="118" width="68" height="257" fill="#a0aaab"/><rect x="352" y="73" width="73" height="302" fill="#778387"/><path d="M28 420h398" stroke="#292f30" stroke-width="40"/><text x="22" y="486" fill="#f6f7f4" font-size="16" font-weight="700">RIYADH / GLASS DISTRICT</text></g></g><g transform="translate(80 785)"><rect width="1440" height="132" rx="20" fill="#151918"/><text x="28" y="39" fill="#d8ff69" font-family="Arial" font-size="17" font-weight="700">WORLD RULES</text><text x="28" y="79" fill="#e7e9e5" font-family="Arial" font-size="18">Warm limestone · graphite · sand · muted amber · restrained reflections · believable Saudi architecture</text><text x="28" y="108" fill="#aeb5af" font-family="Arial" font-size="16">No neon cyberpunk, no impossible holograms, no random location changes. The world must feel like one campaign.</text></g></svg>