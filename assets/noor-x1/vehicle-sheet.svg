d" stroke="#464b47"/><text x="28" y="42" fill="#d8ff69" font-family="Arial" font-size="17" font-weight="700">DETAIL LOCKS</text><g font-family="Arial" font-size="18" fill="#e6e8e3"><text x="30" y="88">01 · LED headlight geometry</text><text x="30" y="128">02 · Flush door handles</text><text x="30" y="168">03 · Turbine wheel design</text><text x="30" y="208">04 · Black panoramic roof</text><text x="30" y="248">05 · Satin graphite paint</text></g></g><g transform="translate(780 545)"><rect width="710" height="300" rx="22" fill="#191e1d" stroke="#464b47"/><text x="28" y="42" fill="#d8ff69" font-family="Arial" font-size="17" font-weight="700">CONTINUITY RULE</text><text x="28" y="92" fill="#f2f3ee" font-family="Arial" font-size="25" font-weight="700">The car must read as one exact product</text><text x="28" y="128" fill="#bbc1bc" font-family="Arial" font-size="18">across villa, desert, Riyadh, tunnel and hero shots.</text><text x="28" y="185" fill="#bbc1bc" font-family="Arial" font-size="18">No grille changes · no wheel swaps · no roofline drift · no logo mutation.</text><text x="28" y="238" fill="#d8ff69" font-family="Arial" font-size="17" font-weight="700">REFERENCE BEFORE MOTION.</text></g></svg>