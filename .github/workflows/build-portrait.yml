name: Build high-quality portrait

on:
  push:
    branches: [main]
    paths:
      - 'portrait-editorial.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild portrait asset
        run: |
          cat .portrait_parts/part*.txt | tr -d '\n\r ' | base64 -d > portrait.webp
          file portrait.webp
      - name: Commit portrait asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portrait.webp
          git diff --cached --quiet || git commit -m "Build high-quality portrait asset"
          git push
